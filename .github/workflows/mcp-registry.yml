name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - 'integrations/mcp-registry/server.json'
      - '.github/workflows/mcp-registry.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_${ARCH}.tar.gz" | tar -xz
          chmod +x mcp-publisher

      - name: Authenticate with MCP Registry via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish integrations/mcp-registry/server.json
